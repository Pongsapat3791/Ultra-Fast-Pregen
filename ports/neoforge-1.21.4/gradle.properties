org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# NeoForge Properties
# check these on https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.4
# Minecraft 1.21.2 to 1.21.4: the same to this mod; 1.21.5 changed how saved data (NBT) is read.
minecraft_version_range=[1.21.2,1.21.5)
neo_version=21.4.161
# Lowest NeoForge this mod accepts (only @Mod, FMLPaths and RegisterCommandsEvent are used).
neo_version_range=[21.2,)
moddev_version=2.0.148

# Mod Properties
version=1.21.2-1.21.4-16
group=com.example.pregen
archives_base_name=ultrafastpregen-neoforge

# Forge's jar of this tree (./gradlew forgeJar, see shared/forge/forge-jar.gradle): Forge 53 is Minecraft 1.21.3, 54 is 1.21.4 (there is no Forge for 1.21.2).
forge_minecraft_versions=1.21.3-1.21.4
forge_minecraft_range=[1.21.3,1.21.5)
forge_version_range=[53,55)
forge_loader_range=[53,)
