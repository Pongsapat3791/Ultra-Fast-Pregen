org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# NeoForge Properties
# check these on https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.11
# Minecraft 1.21.11 only: 1.21.10 and older name things differently (see ports/neoforge-1.21.9), and the next
# version is 26.1, which the 26.x jar covers.
minecraft_version_range=[1.21.11,1.21.12)
neo_version=21.11.48
# Lowest NeoForge this mod accepts (only @Mod, FMLPaths and RegisterCommandsEvent are used).
neo_version_range=[21.11,)
moddev_version=2.0.148

# Mod Properties
version=1.21.11-16
group=com.example.pregen
archives_base_name=ultrafastpregen-neoforge

# Forge's jar of this tree (./gradlew forgeJar, see shared/forge/forge-jar.gradle): Forge 61 is Minecraft 1.21.11.
forge_minecraft_versions=1.21.11
forge_minecraft_range=[1.21.11,1.21.12)
forge_version_range=[61,62)
forge_loader_range=[61,)
