org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# NeoForge Properties
# check these on https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.8
# Minecraft 1.21.6 to 1.21.8: the same to this mod (its other builds miss the same things on all three).
minecraft_version_range=[1.21.6,1.21.9)
neo_version=21.8.57
# Lowest NeoForge this mod accepts (only @Mod, FMLPaths and RegisterCommandsEvent are used).
neo_version_range=[21.6,)
moddev_version=2.0.148

# Mod Properties
version=1.21.6-1.21.8-16
group=com.example.pregen
archives_base_name=ultrafastpregen-neoforge

# Forge's jar of this tree (./gradlew forgeJar, see shared/forge/forge-jar.gradle): Forge 56 is Minecraft 1.21.6, 57 is 1.21.7, 58 is 1.21.8.
forge_minecraft_versions=1.21.6-1.21.8
forge_minecraft_range=[1.21.6,1.21.9)
forge_version_range=[56,59)
forge_loader_range=[56,)
