org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# NeoForge Properties
# check these on https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
# Runs on Minecraft 1.21 and 1.21.1; 1.21.2 changed chunk saving and more (see COMPATIBILITY.md).
minecraft_version_range=[1.21,1.21.2)
neo_version=21.1.259
# Lowest NeoForge this mod accepts (only @Mod, FMLPaths and RegisterCommandsEvent are used).
neo_version_range=[21.0,)
moddev_version=2.0.148

# Mod Properties
# Same update round as the Fabric 1.20.1 build: ultrafastpregen-neoforge-1.21.1-x
version=1.21-1.21.1-16
group=com.example.pregen
archives_base_name=ultrafastpregen-neoforge

# Forge's jar of this tree (./gradlew forgeJar, see shared/forge/forge-jar.gradle): Forge 51 is Minecraft 1.21, 52 is 1.21.1.
forge_minecraft_versions=1.21-1.21.1
forge_minecraft_range=[1.21,1.21.2)
forge_version_range=[51,53)
forge_loader_range=[51,)
