org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# NeoForge Properties (Minecraft 26.x ships unobfuscated: compiled against its own names)
# check these on https://projects.neoforged.net/neoforged/neoforge
minecraft_version=26.1.2
# Runs on Minecraft 26.1.2 and 26.2; 26.2's changes are chosen at start-up (see mixin.PregenMixinPlugin). NeoForge for 26.1
# and 26.1.1 (betas only) bundles MixinExtras 0.5.3, which fails on this jar's @Redirect mixins (0.5.5 reads them).
minecraft_version_range=[26.1.2,26.3)
neo_version=26.1.2.122
# Lowest NeoForge this mod accepts (only @Mod, FMLPaths and RegisterCommandsEvent are used).
neo_version_range=[26.1.2,)
moddev_version=2.0.148

# Mod Properties
# Same update round as the Fabric 1.20.1 build: ultrafastpregen-neoforge-26.1.2-x
version=26.1.2-26.2-15.1
group=com.example.pregen
archives_base_name=ultrafastpregen-neoforge
