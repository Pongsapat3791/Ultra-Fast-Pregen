org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# NeoForge Properties
# check these on https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.5
# Minecraft 1.21.5 only: 1.21.6 changed how saved entities are read and how the game names its version.
minecraft_version_range=[1.21.5,1.21.6)
neo_version=21.5.101
# Lowest NeoForge this mod accepts (only @Mod, FMLPaths and RegisterCommandsEvent are used).
neo_version_range=[21.5,)
moddev_version=2.0.148

# Mod Properties
version=1.21.5-16
group=com.example.pregen
archives_base_name=ultrafastpregen-neoforge

# Forge's jar of this tree (./gradlew forgeJar, see shared/forge/forge-jar.gradle): Forge 55 is Minecraft 1.21.5.
forge_minecraft_versions=1.21.5
forge_minecraft_range=[1.21.5,1.21.6)
forge_version_range=[55,56)
forge_loader_range=[55,)
