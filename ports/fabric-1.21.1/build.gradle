plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	mods {
		"ultrafastpregen" {
			sourceSet sourceSets.main
		}
		"pregen-benchmark" {
			sourceSet sourceSets.test
		}
	}
	runs {
		partialBatchCheck {
			server()
			name = "Partial existing batch regression"
			source sourceSets.test
			runDir "build/partial-batch-check"
			vmArgs "-Xmx4G", "-Dpregen.partialBatchCheck=true"
			["pipelineBenchmark", "pipelineBenchmark.rounds", "pipelineBenchmark.threads", "pipelineBenchmark.profile", "pipelineBenchmark.variant", "batchBenchmark", "batchBenchmark.worldK", "batchBenchmark.threads", "onlyChecks"].each { key ->
				def value = providers.gradleProperty(key).orNull
				if (value != null) vmArgs "-Dpregen.${key}=${value}"
			}
			def heap = providers.gradleProperty("checkHeap").orNull
			if (heap != null) vmArgs "-Xmx${heap}"
			programArgs "nogui"
		}
		singleplayerCheck {
			client()
			name = "Singleplayer check"
			source sourceSets.test
			runDir "build/singleplayer-check"
			def heap = providers.gradleProperty("checkHeap").orNull ?: "3G"
			vmArgs "-Xmx${heap}", "-Dpregen.singleplayerCheck=true"
			programArgs "--quickPlaySingleplayer", "sp-check"
		}
		terrainBenchmark {
			server()
			name = "Stage 2 terrain benchmark"
			source sourceSets.test
			runDir "build/terrain-benchmark"
			vmArgs "-Xmx4G", "-Dpregen.benchmark=true"
			// Bootstrap only: the test initializer exits before starting a server.
			["chunks", "threads", "warmupChunks", "warmupIterations", "iterations", "seeds", "jfr", "output", "optimized", "compare", "blendingScan", "saveSpeed", "ab"].each { key ->
				def value = providers.gradleProperty("benchmark.${key}").orNull
				if (value != null) vmArgs "-Dpregen.benchmark.${key}=${value}"
			}
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

tasks.named('test') {
	// Executable Fabric checks run through runTerrainBenchmark, outside JUnit.
	failOnNoDiscoveredTests = false
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
