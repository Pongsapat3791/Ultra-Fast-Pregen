org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Forge Properties
minecraft_version=1.20.1
forge_version=1.20.1-47.4.28
# Lowest Forge this mod accepts (only @Mod, FMLPaths and Mixin, which every 1.20.1 Forge has).
forge_version_range=[46,)
loader_version_range=[46,)
# Runs on Minecraft 1.20 to 1.20.4 (Forge 1.20.6 runs Mojang names, not this jar's SRG names; there is no Forge 1.20.5).
minecraft_version_range=[1.20,1.20.5)
minecraft_versions=1.20-1.20.4
moddev_version=2.0.148

# Mod Properties. The update round (version) comes from the Fabric build's gradle.properties,
# whose source this build compiles: ultrafastpregen-forge-1.20.1-x
group=com.example.pregen
archives_base_name=ultrafastpregen-forge
