plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

version = project.version
group = project.group

base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    enable {
        version = project.neo_version
        // Only compiled classes are needed; skips decompiling and recompiling Minecraft.
        disableRecompilation = true
    }

    mods {
        ultrafastpregen {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xmaxerrs', '5000']
}

tasks.named('processResources') {
    def props = [version: project.version, neo_version_range: project.neo_version_range,
                 minecraft_version_range: project.minecraft_version_range]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

// The sources are the 26.x family's (ports/neoforge-26.1.2). What Minecraft 1.21.11 and older spell differently
// is in ports/neoforge-1.21.11, and what 1.21.9 and 1.21.10 spell differently again is here; a file further
// down this list replaces the file of the same path above it.
def family = file('../neoforge-26.1.2/src/main')
def newer = file('../neoforge-1.21.11/src/main/java')
def own = file('src/main/java')
sourceSets.main {
    java {
        srcDir new File(family, 'java')
        srcDir newer
        // Link and Manager, parts of the mod on every loader and version (see shared/).
        srcDir '../../shared/java'
        exclude { element ->
            if (element.directory) return false
            def path = element.relativePath.pathString
            def from = element.file.toPath()
            if (from.startsWith(family.toPath())) return new File(newer, path).isFile() || new File(own, path).isFile()
            return from.startsWith(newer.toPath()) && new File(own, path).isFile()
        }
    }
    resources {
        srcDir new File(family, 'resources')
        srcDir '../../shared/resources'
        exclude { element ->
            !element.directory && element.file.toPath().startsWith(family.toPath()) &&
                new File(file('src/main/resources'), element.relativePath.pathString).isFile()
        }
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_ultrafastpregen" }
    }
    manifest {
        // java -jar <this jar> merge|check ...: Link's tool that adds a generated world's chunks to another world.
        attributes('Main-Class': 'io.github.pongsapat3791.ultrafastpregen.link.tool.MergeTool')
    }
}

// Forge takes the same classes (see the script).
apply from: "../../shared/forge/forge-jar.gradle"
