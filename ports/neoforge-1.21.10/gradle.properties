org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# NeoForge Properties
# check these on https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.10
# Minecraft 1.21.9 and 1.21.10: the same to this mod (its 1.21.11 and 26.x builds miss the same things on both).
minecraft_version_range=[1.21.9,1.21.11)
neo_version=21.10.64
# Lowest NeoForge this mod accepts (only @Mod, FMLPaths and RegisterCommandsEvent are used).
neo_version_range=[21.9,)
moddev_version=2.0.148

# Mod Properties
version=1.21.9-1.21.10-16
group=com.example.pregen
archives_base_name=ultrafastpregen-neoforge

# Forge's jar of this tree (./gradlew forgeJar, see shared/forge/forge-jar.gradle): Forge 59 is Minecraft 1.21.9, 60 is 1.21.10.
forge_minecraft_versions=1.21.9-1.21.10
forge_minecraft_range=[1.21.9,1.21.11)
forge_version_range=[59,61)
forge_loader_range=[59,)
