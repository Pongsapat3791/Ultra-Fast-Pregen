<text x="32.0" y="540.0" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal">Each run: fresh world, square of radius 1,500 blocks (3,000 x 3,000 blocks); chunks per run: Vanilla 35,721 | Ultra Fast Pregen 35,344.</text>
