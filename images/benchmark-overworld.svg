<text x="32.0" y="576.0" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal">System: AMD Ryzen 5 7500F (6C/12T), 32 GB RAM, Windows 11 Pro.</text>
<text x="32.0" y="594.0" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal">Minecraft 26.1.2, NeoForge 26.1.2.122.</text>
<text x="32.0" y="612.0" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal">Mods: Ultra Fast Pregen 14 | Chunky 1.5.4 | Tectonic 3.0.28 | Lithostitched 1.8.1 | WWOO 2.7.0 | Cristel Lib 3.1.13 | Cloth Config 26.1.154.</text>
<text x="32.0" y="630.0" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal">Vanilla: Minecraft's own generation, driven by Chunky (same method as Bye?Pregen's chart).</text>
<text x="32.0" y="648.0" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal">Ultra Fast Pregen runs on the CPU only: no OpenCL / GPU acceleration.</text>
